# Degoog + Valkey shared cache + PostgreSQL indexer backend.
# Good for: high-traffic public instances that want both cross-process caching
# and a fairly scalable indexer.
#
# Converted to a NixOS module via compose2nix (modules/services/degoog.nix).
# Secrets are provided by sops-nix: the "degoog" secret is an env file shared
# by the degoog and postgres containers.

services:
  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    volumes:
      - /var/lib/degoog/data:/app/data
    ports:
      - "127.0.0.1:4444:4444"
    restart: unless-stopped
    environment:
      # Leave DEGOOG_SETTINGS_PASSWORDS unset only for trusted local/LAN use.
      # If this instance is reachable from the internet, SET A PASSWORD: an
      # unlocked instance lets anyone install extensions, which runs code on
      # the server. When "true", every admin and store action stays behind the
      # password above even on a local network.
      DEGOOG_PUBLIC_INSTANCE: "false"
      DEGOOG_VALKEY_URL: "redis://valkey:6379"
    labels:
      - "compose2nix.settings.sops.secrets=degoog"
    depends_on:
      valkey:
        condition: service_started
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: degoog
      POSTGRES_USER: degoog
    labels:
      - "compose2nix.settings.sops.secrets=degoog"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degoog -d degoog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
